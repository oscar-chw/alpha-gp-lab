name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests, hand cases, SYNTHETIC runs and replays (real-data steps skip without data/)
        run: PYTHON=python bash scripts/check.sh
